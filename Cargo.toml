[workspace]
resolver = "2"
members = ["crates/winsar-core", "crates/winsar-cli", "crates/winsar-shell", "crates/winsar-preview", "app/src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/moha528/winsar"
homepage = "https://github.com/moha528/winsar"

[workspace.dependencies]
winsar-core = { path = "crates/winsar-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Pas de panic = "abort" : winsar-shell tourne dans explorer.exe et doit pouvoir
# rattraper une panique (catch_unwind) au lieu de faire tomber l'Explorateur.
