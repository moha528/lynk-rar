[package]
name = "winsar-shell"
description = "WinSAR : menu contextuel natif de Windows 11 (IExplorerCommand)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# rlib : sans lui, `cargo test` ne reconstruit pas la DLL que charge tests/com.rs.
crate-type = ["cdylib", "rlib"]

# Volontairement sans winsar-core : cette DLL est chargée dans explorer.exe,
# elle doit rester minuscule et ne rien faire d'autre que lancer winsar-app.
[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
] }
