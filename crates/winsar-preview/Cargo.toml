[package]
name = "winsar-preview"
description = "WinSAR : aperçu du contenu des archives dans le volet de l'Explorateur (IPreviewHandler)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# rlib : pour que `cargo test` reconstruise la DLL que charge tests/preview.rs.
crate-type = ["cdylib", "rlib"]

# Contrairement à winsar-shell, cette DLL tourne dans prevhost.exe, processus isolé
# lancé par l'Explorateur pour les aperçus : elle peut embarquer le moteur.
[dependencies]
winsar-core.workspace = true
chrono.workspace = true

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
